<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Jeffrey Cedeño</title>
<meta id="meta-desc" name="description" content="">
<meta id="og-title" property="og:title" content="">
<meta id="og-desc" property="og:description" content="">
<meta property="og:type" content="article">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500&family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --bg:      #ffffff;
  --ink:     #111111;
  --ink2:    #444444;
  --ink3:    #888888;
  --accent:  #1a472a;
  --border:  #e8e8e8;
  --mono:    'DM Mono', monospace;
  --sans:    'DM Sans', sans-serif;
  --display: 'Syne', sans-serif;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.7;
}

/* ── Nav ── */
nav {
  position: sticky;
  top: 0;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  height: 52px;
  z-index: 100;
}
.nav-logo {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink);
  text-decoration: none;
}
.nav-logo:hover { color: var(--accent); }
.nav-back {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink3);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.nav-back:hover { color: var(--ink); }

/* ── Outer wrapper ── */
.outer {
  max-width: 1060px;
  margin: 0 auto;
  padding: 0 2rem;
}

/* ── Hero / cover ── */
.proj-cover {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  display: block;
  border-bottom: 1px solid var(--border);
}
.proj-cover-placeholder {
  width: 100%;
  height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 14px;
  color: rgba(255,255,255,0.55);
}

/* ── Main layout: content + TOC sidebar ── */
.proj-layout {
  display: flex;
  gap: 3.5rem;
  padding-top: 2.5rem;
  align-items: flex-start;
}
.proj-content {
  flex: 1;
  min-width: 0;
  padding-bottom: 5rem;
}

/* ── TOC sidebar ── */
.proj-toc {
  width: 196px;
  flex-shrink: 0;
  position: sticky;
  top: 70px;
  align-self: flex-start;
}
.toc-label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink3);
  margin-bottom: 0.75rem;
}
.toc-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.toc-list a {
  display: block;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink3);
  text-decoration: none;
  padding: 4px 0 4px 10px;
  border-left: 2px solid var(--border);
  transition: color 0.12s, border-color 0.12s;
  line-height: 1.4;
}
.toc-list a:hover,
.toc-list a.active {
  color: var(--ink);
  border-left-color: var(--ink);
}

/* ── Hero block ── */
.proj-hero {
  margin-bottom: 2.5rem;
  padding-bottom: 2rem;
  border-bottom: 1px solid var(--border);
}
.proj-breadcrumb {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink3);
  margin-bottom: 0.75rem;
}
.proj-breadcrumb a { color: var(--ink3); text-decoration: none; }
.proj-breadcrumb a:hover { color: var(--ink); }
.proj-title {
  font-family: var(--display);
  font-size: clamp(1.6rem, 4vw, 2.3rem);
  font-weight: 800;
  line-height: 1.15;
  margin-bottom: 1rem;
  color: var(--ink);
}
.proj-meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
}
.cat-badge {
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 4px;
  font-weight: 500;
}
.status-badge {
  font-family: var(--mono);
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 4px;
}
.status-completed { background: rgba(22,163,74,0.1); color: #166534; }
.status-in-progress { background: rgba(217,119,6,0.1); color: #92400e; }
.status-planned { background: #f3f4f6; color: var(--ink3); }

.proj-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
}
.proj-detail-item {}
.proj-detail-label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink3);
  margin-bottom: 0.3rem;
}
.proj-detail-value {
  font-size: 13.5px;
  color: var(--ink2);
}
.tools-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  margin-top: 0.3rem;
}
.tool-pill {
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: #f5f5f5;
  border: 1px solid var(--border);
  color: var(--ink2);
}

/* ── Note banner ── */
.proj-note {
  background: #fffbeb;
  border: 1px solid rgba(217,119,6,0.25);
  border-radius: 6px;
  padding: 0.75rem 1rem;
  font-size: 13px;
  color: #78350f;
  font-family: var(--mono);
  margin-bottom: 2rem;
}

/* ── Sections ── */
.proj-section {
  margin-bottom: 3rem;
  scroll-margin-top: 80px;
}
.proj-section-title {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink3);
  margin-bottom: 1rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border);
}
.proj-section p, .proj-section li {
  font-size: 14.5px;
  color: var(--ink2);
  line-height: 1.7;
}

/* ── Mermaid ── */
.mermaid-wrap {
  background: #fafafa;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  overflow-x: auto;
  margin-top: 0.5rem;
}
.mermaid { font-family: var(--mono) !important; }

/* ── Tables ── */
.proj-table-wrap { overflow-x: auto; margin-top: 0.5rem; }
.proj-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}
.proj-table th {
  font-family: var(--mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink3);
  font-weight: 500;
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: #fafafa;
}
.proj-table td {
  padding: 9px 12px;
  border-bottom: 1px solid #f0f0f0;
  color: var(--ink2);
  vertical-align: top;
}
.proj-table tr:last-child td { border-bottom: none; }
.proj-table tr:hover td { background: #fafafa; }
.table-note {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 0.5rem;
}

/* ── Lists ── */
.proj-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin-top: 0.5rem;
}
.proj-list li {
  padding-left: 1.1rem;
  position: relative;
}
.proj-list li::before {
  content: "–";
  position: absolute;
  left: 0;
  color: var(--ink3);
}

/* ── Workflow cards ── */
.workflow-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 0.5rem;
}
details.workflow-card {
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
details.workflow-card[open] {
  border-color: #bbb;
}
details.workflow-card summary {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.9rem 1.1rem;
  cursor: pointer;
  list-style: none;
  background: #fafafa;
  user-select: none;
}
details.workflow-card summary::-webkit-details-marker { display: none; }
details.workflow-card summary::before {
  content: "▶";
  font-size: 9px;
  color: var(--ink3);
  transition: transform 0.15s;
  flex-shrink: 0;
}
details.workflow-card[open] summary::before {
  transform: rotate(90deg);
}
.wf-id {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  background: var(--ink);
  color: var(--bg);
  padding: 2px 7px;
  border-radius: 3px;
}
.wf-name {
  font-weight: 600;
  font-size: 14px;
  flex: 1;
}
.wf-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 3px;
  background: rgba(26,71,42,0.08);
  color: var(--accent);
}
.workflow-card-body {
  padding: 0.75rem 1.1rem 1rem;
  border-top: 1px solid var(--border);
}
.wf-trigger-label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--ink3);
  margin-bottom: 0.25rem;
}
.wf-trigger-val {
  font-size: 13.5px;
  color: var(--ink2);
  margin-bottom: 0.85rem;
}
.wf-steps {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  counter-reset: step;
}
.wf-steps li {
  padding-left: 2rem;
  position: relative;
  font-size: 13.5px;
  color: var(--ink2);
  counter-increment: step;
}
.wf-steps li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--bg);
  background: var(--ink3);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  top: 3px;
}

/* ── Design decisions ── */
.dd-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 0.5rem;
}
.dd-item {
  border-left: 2px solid var(--border);
  padding: 0.1rem 0 0.1rem 1rem;
}
.dd-title {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 0.25rem;
}
.dd-body {
  font-size: 13.5px;
  color: var(--ink2);
}

/* ── Gallery / Lightbox ── */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0.75rem;
  margin-top: 0.75rem;
}
.gallery-thumb {
  cursor: zoom-in;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid var(--border);
  aspect-ratio: 16/10;
  background: #f4f4f4;
  transition: border-color 0.15s;
}
.gallery-thumb:hover { border-color: #aaa; }
.gallery-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.gallery-thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink3);
  text-align: center;
  padding: 0.5rem;
}

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 999;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
  padding: 2rem;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 90vw;
  max-height: 88vh;
  object-fit: contain;
  border-radius: 4px;
  cursor: default;
}
.lightbox-caption {
  position: fixed;
  bottom: 1.25rem;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  text-align: center;
  pointer-events: none;
  max-width: 600px;
}
.lightbox-close {
  position: fixed;
  top: 1rem;
  right: 1.25rem;
  background: none;
  border: none;
  color: rgba(255,255,255,0.5);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 0.25rem 0.5rem;
  line-height: 1;
}
.lightbox-close:hover { color: #fff; }

/* ── Images needed notice ── */
.images-needed {
  background: #f5f5f5;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem 1.25rem;
  margin-top: 1rem;
}
.images-needed-title {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink3);
  margin-bottom: 0.5rem;
}
.images-needed ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.images-needed li {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink2);
  padding-left: 1rem;
  position: relative;
}
.images-needed li::before { content: "·"; position: absolute; left: 0; color: var(--ink3); }

/* ── Next steps ── */
.next-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
.next-list li {
  padding-left: 1.5rem;
  position: relative;
  font-size: 14.5px;
  color: var(--ink2);
}
.next-list li::before {
  content: "→";
  position: absolute;
  left: 0;
  color: var(--ink3);
  font-family: var(--mono);
}

/* ── Store availability ── */
.store-availability-note {
  font-size: 14px;
  color: var(--ink2);
  margin-bottom: 1rem;
  line-height: 1.6;
}
.store-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.store-badge {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.6rem 1.1rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface, #fafafa);
  opacity: 0.65;
  cursor: default;
  user-select: none;
}
.store-badge-icon { font-size: 24px; line-height: 1; }
.store-badge-sub {
  font-size: 10px;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-family: var(--mono);
}
.store-badge-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink1);
}

/* ── Code inline ── */
code {
  font-family: var(--mono);
  font-size: 0.88em;
  background: #f3f4f6;
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--ink);
}

/* ── Not found ── */
.not-found {
  padding: 4rem 0;
  text-align: center;
  font-family: var(--mono);
  color: var(--ink3);
}
.not-found a { color: var(--accent); }

/* ── Footer ── */
.port-footer {
  border-top: 1px solid var(--border);
  padding: 1.5rem 0 3rem;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink3);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}
.port-footer a { color: var(--ink3); text-decoration: none; }
.port-footer a:hover { color: var(--ink); }

/* ── Responsive ── */
@media (max-width: 820px) {
  .proj-toc { display: none; }
  .proj-layout { flex-direction: column; }
}
@media (max-width: 600px) {
  .outer { padding: 0 1rem; }
  nav { padding: 0 1rem; }
  .proj-detail-grid { grid-template-columns: 1fr 1fr; }
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">jeffreycedeno.com</a>
  <a href="index.html" class="nav-back">← Portfolio</a>
</nav>

<div id="cover-slot"></div>

<div class="outer">
  <div class="proj-layout">
    <main class="proj-content" id="proj-content">
      <div class="not-found">
        <p>Loading…</p>
      </div>
    </main>
    <aside class="proj-toc" id="proj-toc" aria-label="Table of contents"></aside>
  </div>
  <footer class="port-footer">
    <span>Jeffrey Cedeño · <a href="/">jeffreycedeno.com</a></span>
    <span><a href="mailto:hello@jeffreycedeno.com">hello@jeffreycedeno.com</a></span>
  </footer>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <button class="lightbox-close" id="lb-close" aria-label="Close">✕</button>
  <img id="lb-img" src="" alt="">
  <div class="lightbox-caption" id="lb-cap"></div>
</div>

<script src="data.js?v=20260923b"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js" crossorigin="anonymous"></script>
<script>
(function () {
  // ── Init Mermaid ──────────────────────────────────────────────────────────
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      fontFamily: "'DM Mono', monospace",
      primaryColor: '#f0f7f2',
      primaryBorderColor: '#1a472a',
      primaryTextColor: '#111111',
      lineColor: '#444444',
      secondaryColor: '#f5f5f5',
      tertiaryColor: '#fff',
    },
  });

  // ── Helpers ───────────────────────────────────────────────────────────────
  function qs(id) { return document.getElementById(id); }

  function statusClass(s) {
    if (!s) return '';
    const m = s.toLowerCase();
    if (m === 'completed') return 'status-completed';
    if (m.includes('progress')) return 'status-in-progress';
    return 'status-planned';
  }

  function renderTable(comp) {
    const headersHtml = comp.headers.map(h => `<th>${h}</th>`).join('');
    const rowsHtml = comp.rows.map(row =>
      `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
    ).join('');
    return `
      <div class="proj-table-wrap">
        <table class="proj-table">
          <thead><tr>${headersHtml}</tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      ${comp.note ? `<p class="table-note">${comp.note}</p>` : ''}`;
  }

  function renderComponent(comp) {
    let inner = '';
    if (comp.type === 'table') {
      inner = renderTable(comp);
    } else if (comp.type === 'list') {
      inner = `<ul class="proj-list">${(comp.items || []).map(i => `<li>${i}</li>`).join('')}</ul>`;
    } else if (comp.type === 'text') {
      inner = `<p>${comp.content}</p>`;
    }
    return `
      <div class="proj-section" id="comp-${comp.id || ''}">
        <div class="proj-section-title">${comp.title}${comp.subtitle ? ` <span style="font-weight:300;text-transform:none;letter-spacing:0;">&nbsp;·&nbsp;${comp.subtitle}</span>` : ''}</div>
        ${inner}
      </div>`;
  }

  function renderWorkflow(wf) {
    const stepsHtml = (wf.steps || []).map(s => `<li>${s}</li>`).join('');
    return `
      <details class="workflow-card">
        <summary>
          <span class="wf-id">${wf.id}</span>
          <span class="wf-name">${wf.name}</span>
          ${wf.badge ? `<span class="wf-badge">${wf.badge}</span>` : ''}
        </summary>
        <div class="workflow-card-body">
          <div class="wf-trigger-label">Trigger</div>
          <div class="wf-trigger-val">${wf.trigger}</div>
          <ol class="wf-steps">${stepsHtml}</ol>
        </div>
      </details>`;
  }

  function renderGallery(images, imagesNeeded) {
    const thumbs = (images || []).map(img => `
      <div class="gallery-thumb" data-src="${img.src}" data-alt="${img.alt}" role="button" tabindex="0" aria-label="Expand: ${img.alt}">
        <img src="${img.src}" alt="${img.alt}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=gallery-thumb-placeholder>${img.alt}</div>'">
      </div>`).join('');

    const needed = imagesNeeded ? `
      <div class="images-needed">
        <div class="images-needed-title">Screenshots pending</div>
        <ul>${imagesNeeded.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>` : '';

    return `
      <div class="gallery-grid">${thumbs}</div>
      ${needed}`;
  }

  // ── TOC section list ──────────────────────────────────────────────────────
  function buildTOC(p) {
    const items = [];
    if (p.overview) items.push({ id: 'sec-overview', label: 'Overview' });
    if (p.architectureMermaid) items.push({ id: 'sec-architecture', label: 'Architecture' });
    if (p.components && p.components.length) items.push({ id: 'sec-components', label: 'Components' });
    if (p.workflows && p.workflows.length) items.push({ id: 'sec-workflows', label: 'Workflows' });
    if (p.designDecisions && p.designDecisions.length) items.push({ id: 'sec-decisions', label: 'Design Decisions' });
    if (p.testing) items.push({ id: 'sec-testing', label: 'Testing' });
    if (p.images && p.images.length) items.push({ id: 'sec-gallery', label: 'Gallery' });
    if (p.nextSteps && p.nextSteps.length) items.push({ id: 'sec-next', label: "What's Next" });
    if (p.downloads) items.push({ id: 'sec-downloads', label: 'Download' });
    return items;
  }

  function initTOCScroll(items) {
    if (!items.length) return;
    const links = document.querySelectorAll('.toc-list a');
    const sections = items.map(it => document.getElementById(it.id)).filter(Boolean);

    function onScroll() {
      let current = sections[0];
      const offset = 100;
      sections.forEach(s => {
        if (s && s.getBoundingClientRect().top < offset) current = s;
      });
      links.forEach(l => {
        l.classList.toggle('active', l.getAttribute('href') === '#' + (current && current.id));
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // ── Main render ───────────────────────────────────────────────────────────
  function renderProject(p) {
    const cat = getCategoryBySlug(p.category);
    const tocItems = buildTOC(p);

    // Update page title + meta
    document.title = `${p.title} — Jeffrey Cedeño`;
    qs('meta-desc').setAttribute('content', p.summary);
    qs('og-title').setAttribute('content', `${p.title} — Jeffrey Cedeño`);
    qs('og-desc').setAttribute('content', p.summary);

    // Cover
    if (p.cover) {
      qs('cover-slot').innerHTML = `<img class="proj-cover" src="${p.cover}" alt="${p.title}" onerror="this.outerHTML=''">`;
    } else {
      qs('cover-slot').innerHTML = `<div class="proj-cover-placeholder" style="background:${cat.color};opacity:0.8;">${cat.label}</div>`;
    }

    // TOC sidebar
    qs('proj-toc').innerHTML = tocItems.length ? `
      <div class="toc-label">On this page</div>
      <ul class="toc-list">
        ${tocItems.map(it => `<li><a href="#${it.id}">${it.label}</a></li>`).join('')}
      </ul>` : '';

    // Hero
    let html = `
      <div class="proj-hero">
        <div class="proj-breadcrumb"><a href="index.html">Portfolio</a> / ${cat.label}</div>
        <h1 class="proj-title">${p.title}</h1>
        <div class="proj-meta-row">
          <span class="cat-badge" style="background:${cat.bg};color:${cat.color};">${cat.label}</span>
          <span class="status-badge ${statusClass(p.status)}">${p.status}</span>
        </div>
        <div class="proj-detail-grid">
          ${p.role ? `<div class="proj-detail-item"><div class="proj-detail-label">Role</div><div class="proj-detail-value">${p.role}</div></div>` : ''}
          ${p.date ? `<div class="proj-detail-item"><div class="proj-detail-label">Date</div><div class="proj-detail-value">${p.date}</div></div>` : ''}
          ${p.tools && p.tools.length ? `<div class="proj-detail-item" style="grid-column:1/-1"><div class="proj-detail-label">Tools</div><div class="tools-row">${p.tools.map(t => `<span class="tool-pill">${t}</span>`).join('')}</div></div>` : ''}
          ${p.repoUrl ? `<div class="proj-detail-item"><div class="proj-detail-label">Code</div><div class="proj-detail-value"><a href="${p.repoUrl}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:13px;">↗ ${p.repoUrl.replace(/^https?:\/\//, '')}</a></div></div>` : ''}
        </div>
      </div>`;

    // Demo note
    if (p.note) {
      html += `<div class="proj-note">ℹ ${p.note}</div>`;
    }

    // Overview
    if (p.overview) {
      html += `
        <div class="proj-section" id="sec-overview">
          <div class="proj-section-title">Overview</div>
          <p>${p.overview}</p>
        </div>`;
    }

    // Architecture
    if (p.architectureMermaid) {
      html += `
        <div class="proj-section" id="sec-architecture">
          <div class="proj-section-title">Architecture</div>
          <div class="mermaid-wrap">
            <div class="mermaid">${p.architectureMermaid.trim()}</div>
          </div>
        </div>`;
    }

    // Components
    if (p.components && p.components.length) {
      html += `
        <div class="proj-section" id="sec-components">
          <div class="proj-section-title">Components Built</div>
          ${p.components.map(renderComponent).join('')}
        </div>`;
    }

    // Workflows
    if (p.workflows && p.workflows.length) {
      html += `
        <div class="proj-section" id="sec-workflows">
          <div class="proj-section-title">Workflows</div>
          <div class="workflow-list">${p.workflows.map(renderWorkflow).join('')}</div>
        </div>`;
    }

    // Design decisions
    if (p.designDecisions && p.designDecisions.length) {
      html += `
        <div class="proj-section" id="sec-decisions">
          <div class="proj-section-title">Design Decisions & Troubleshooting</div>
          <div class="dd-list">
            ${p.designDecisions.map(d => `
              <div class="dd-item">
                <div class="dd-title">${d.title}</div>
                <div class="dd-body">${d.body}</div>
              </div>`).join('')}
          </div>
        </div>`;
    }

    // Testing
    if (p.testing) {
      html += `
        <div class="proj-section" id="sec-testing">
          <div class="proj-section-title">Testing & Validation</div>
          <p style="margin-bottom:1rem;">${p.testing.description}</p>
          ${p.testing.table ? renderTable(p.testing.table) : ''}
        </div>`;
    }

    // Gallery
    if (p.images && p.images.length) {
      html += `
        <div class="proj-section" id="sec-gallery">
          <div class="proj-section-title">Gallery</div>
          ${renderGallery(p.images, p.imagesNeeded)}
        </div>`;
    }

    // What's next
    if (p.nextSteps && p.nextSteps.length) {
      html += `
        <div class="proj-section" id="sec-next">
          <div class="proj-section-title">What I'd Do Next</div>
          <ul class="next-list">${p.nextSteps.map(s => `<li>${s}</li>`).join('')}</ul>
        </div>`;
    }

    // Downloads / store availability
    if (p.downloads) {
      const icons = { windows: '⊞', mac: '', linux: '🐧', web: '🌐' };
      const badges = (p.downloads.stores || []).map(s => `
        <div class="store-badge">
          <span class="store-badge-icon">${icons[s.platform] || '📦'}</span>
          <div>
            <div class="store-badge-sub">Próximamente en</div>
            <div class="store-badge-name">${s.name}</div>
          </div>
        </div>`).join('');
      html += `
        <div class="proj-section" id="sec-downloads">
          <div class="proj-section-title">Descarga</div>
          <p class="store-availability-note">${p.downloads.note}</p>
          <div class="store-badges">${badges}</div>
        </div>`;
    }

    qs('proj-content').innerHTML = html;

    // Mermaid render
    if (p.architectureMermaid) {
      mermaid.run({ querySelector: '.mermaid' });
    }

    // Gallery lightbox
    document.querySelectorAll('.gallery-thumb').forEach(thumb => {
      const open = () => {
        const lb = qs('lightbox');
        qs('lb-img').src = thumb.dataset.src;
        qs('lb-img').alt = thumb.dataset.alt;
        qs('lb-cap').textContent = thumb.dataset.alt;
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
      };
      thumb.addEventListener('click', open);
      thumb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });

    initTOCScroll(tocItems);
  }

  // ── Lightbox close ────────────────────────────────────────────────────────
  function closeLB() {
    qs('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  qs('lb-close').addEventListener('click', closeLB);
  qs('lightbox').addEventListener('click', e => { if (e.target === qs('lightbox')) closeLB(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });

  // ── Bootstrap ─────────────────────────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const project = slug ? getProjectBySlug(slug) : null;

  if (!project) {
    qs('proj-content').innerHTML = `
      <div class="not-found">
        <p>Project not found.</p>
        <p style="margin-top:0.5rem;"><a href="index.html">← Back to portfolio</a></p>
      </div>`;
  } else if (!project.published) {
    qs('proj-content').innerHTML = `
      <div class="not-found">
        <p>This project is not published yet.</p>
        <p style="margin-top:0.5rem;"><a href="index.html">← Back to portfolio</a></p>
      </div>`;
  } else {
    renderProject(project);
  }
})();
</script>
</body>
</html>
